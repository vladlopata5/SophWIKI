<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Случайная статья</title>
</head>
<body>
  <p id="status">Выбираем случайную статью…</p>
  <script>
    (async () => {
      const status = document.getElementById("status")

      try {
        const base = new URL(".", window.location.href)
        const response = await fetch(new URL("static/contentIndex.json", base))
        if (!response.ok) throw new Error(`Не удалось загрузить индекс: ${response.status}`)

        const index = await response.json()
        const pages = Object.values(index).filter((page) => {
          const path = String(page.filePath ?? "").replaceAll("\\", "/")
          const name = path.split("/").pop() ?? ""

          return Boolean(page.slug)
            && page.slug !== "index"
            && !path.startsWith("99 Служебное/")
            && name !== "README.md"
            && !name.startsWith("0 Индекс")
        })

        if (pages.length === 0) throw new Error("В индексе нет подходящих статей")

        const storageKey = "dnd-wiki-last-random-article"
        const previousSlug = localStorage.getItem(storageKey)
        const candidates = pages.length > 1
          ? pages.filter((page) => String(page.slug) !== previousSlug)
          : pages
        const random = crypto.getRandomValues(new Uint32Array(1))[0]
        const page = candidates[random % candidates.length]
        const slug = String(page.slug).replace(/\/index$/, "")

        localStorage.setItem(storageKey, String(page.slug))
        window.location.replace(new URL(encodeURI(slug), base))
      } catch (error) {
        console.error(error)
        status.textContent = "Не удалось выбрать случайную статью."

        const home = document.createElement("a")
        home.href = "./"
        home.textContent = "Вернуться на главную"
        document.body.appendChild(home)
      }
    })()
  </script>
</body>
</html>
